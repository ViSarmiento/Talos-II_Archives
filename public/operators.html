<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operators – Talos-II Archives</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="operators"><main>
<h2 data-decrypt>Operators</h2>
<p class="dim" style="margin:0 0 6px">Every operator as a drifting silhouette. Point at one to decrypt the full art.</p>
<div class="tools"><div class="uidbar" style="flex:1;min-width:200px"><input id="s" placeholder="Search operators" aria-label="Search operators"></div></div>
<div class="fbar" id="fl"></div>
<p class="dim" id="cnt"></p>
<div class="sgrid" id="grid"></div>
</main>
<script src="/js/data.js"></script><script src="/js/core.js"></script><script src="/js/app.js"></script>
<script>
const f = { el: '' };
// small stable pseudo-random per operator, so each silhouette drifts on its own rhythm (and keeps it between renders)
const rnd = (n, i) => { let h = 2166136261; for (const c of n + i) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 1000) / 1000 };
const tile = o => {
  const d = (rnd(o.name, 'd') * 6).toFixed(2), t = (6 + rnd(o.name, 't') * 4).toFixed(2), duo = ART_DUO[o.name] ? ' duo' : '';
  return `<div class="sil" tabindex="0" role="img" data-rar="${o.rarity}" style="--c:${COL[o.element]};--d:-${d}s;--t:${t}s" aria-label="${esc(o.name)}, ${o.rarity} star ${esc(o.element)} ${esc(o.cls)}">
    <div class="stage"></div>
    <div class="par"><div class="float"><div class="fig">
      <div class="lay s${duo}" data-part="1">${artLayer(o, 480)}</div>
      <div class="lay c${duo}" data-part="1">${artLayer(o, 480)}</div>
    </div></div></div>
    <i class="scan"></i><span class="shade"></span><span class="el">${esc(o.element)}</span>
    <span class="meta"><b>${esc(o.name)}</b><small><span class="st">${stars(o.rarity)}</span><br>${esc(o.cls)} · ${esc(o.weapon)}</small></span></div>`;
};
function draw() {
  const q = key($('#s').value);
  const list = ROSTER.filter(o => (!f.el || o.element === f.el) && key(o.name).includes(q)).sort((a, b) => b.rarity - a.rarity || a.name.localeCompare(b.name));
  $('#grid').innerHTML = list.map(tile).join('') || '<p class="dim">No operators match.</p>';
  $('#cnt').textContent = `${list.length} of ${ROSTER.length} operators`;
  $('#fl').innerHTML = `<div class="chips">${Object.keys(COL).map(e => `<button class="chip ${f.el === e ? 'on' : ''}" data-fe="${e}" style="--c:${COL[e]}">${e}</button>`).join('')}</div>`;
}
$('#fl').onclick = e => { const b = e.target.closest('[data-fe]'); if (!b) return; f.el = f.el === b.dataset.fe ? '' : b.dataset.fe; draw() };
$('#s').oninput = draw;
// pointer parallax: the figure leans toward the cursor
const grid = $('#grid');
grid.addEventListener('pointermove', e => {
  const t = e.target.closest('.sil'); if (!t) return;
  const r = t.getBoundingClientRect(); t.style.setProperty('--px', ((e.clientX - r.left) / r.width * 2 - 1).toFixed(2)); t.style.setProperty('--py', ((e.clientY - r.top) / r.height * 2 - 1).toFixed(2));
});
grid.addEventListener('pointerout', e => { const t = e.target.closest('.sil'); if (t && !t.contains(e.relatedTarget)) { t.style.setProperty('--px', 0); t.style.setProperty('--py', 0) } });
draw();
</script></body></html>
