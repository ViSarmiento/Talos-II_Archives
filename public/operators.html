<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operators – Talos-II Archives</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="operators"><main>
<h2 data-decrypt>Operators</h2>
<p class="dim" style="margin:0 0 6px">Mark the operators you own. Ones that are not on your fetched showcase are added to your Account tab.</p>
<div class="tools"><div class="uidbar" style="flex:1;min-width:200px"><input id="s" placeholder="Search operators" aria-label="Search operators"></div></div>
<div class="fbar" id="fl"></div>
<p class="dim" id="cnt"></p>
<div class="grid" id="pool"></div>
</main>
<script src="/js/data.js"></script><script src="/js/core.js"></script><script src="/js/app.js"></script>
<script>
const f = { el: '', cls: '', rar: 0, own: false };
const fetched = new Set(load('et.ops', []).filter(o => o.known !== false && o.name).map(o => key(o.name)));   // from Enka
let manual = new Set(load('et.owned', []).map(n => lookup(n)?.name).filter(Boolean));                           // marked here
const owned = o => fetched.has(key(o.name)) || manual.has(o.name);

const card = o => {
  const fx = fetched.has(key(o.name)), on = owned(o);
  return `<div class="op ${fx ? 'locked' : 'pick-own'} ${on ? 'owned' : ''}" ${fx ? '' : `data-o="${esc(o.name)}" role="checkbox" aria-checked="${on}" tabindex="0"`} data-rar="${o.rarity}" style="--c:${COL[o.element]}" aria-label="${esc(o.name)}, ${o.rarity} star ${esc(o.element)} ${esc(o.cls)}${fx ? ', on your account' : ''}">${artHtml(o, 360)}<span class="shade"></span><span class="el">${esc(o.element)}</span><span class="meta"><b>${esc(o.name)}</b><small><span class="st">${stars(o.rarity)}</span><br>${esc(o.cls)} · ${esc(o.weapon)}</small><span class="ownlbl"><i>${on ? '✓' : ''}</i>${fx ? 'On your account' : on ? 'Owned' : 'I own this'}</span></span></div>`;
};
function draw() {
  const q = key($('#s').value);
  const list = ROSTER.filter(o => (!f.el || o.element === f.el) && (!f.cls || o.cls === f.cls) && (!f.rar || o.rarity === f.rar) && (!f.own || owned(o)) && key(o.name).includes(q))
    .sort((x, y) => y.rarity - x.rarity || x.name.localeCompare(y.name));
  $('#pool').innerHTML = list.map(card).join('') || '<p class="dim">No operators match those filters.</p>';
  const chip = (attr, val, label, on, c) => `<button class="chip ${on ? 'on' : ''}" data-${attr}="${val}" ${c ? `style="--c:${c}"` : ''}>${label}</button>`;
  $('#fl').innerHTML = `<div class="chips">${Object.keys(COL).map(e => chip('fe', e, e, f.el === e, COL[e])).join('')}</div><span class="sep"></span>
    <div class="chips">${CLASSES.map(c => chip('fc', c, c, f.cls === c)).join('')}</div><span class="sep"></span>
    <div class="chips">${[6, 5, 4].map(r => chip('fr', r, r + '★', f.rar === r)).join('')}${chip('fo', 1, 'Owned only', f.own)}</div>`;
  const total = ROSTER.filter(owned).length;
  $('#cnt').textContent = `${list.length} of ${ROSTER.length} operators shown. ${total} owned (${[...fetched].length} from your account, ${[...manual].filter(n => !fetched.has(key(n))).length} marked here).`;
}
function toggle(name) {
  if (manual.has(name)) manual.delete(name); else manual.add(name);
  save('et.owned', [...manual]); draw();
  const el = [...document.querySelectorAll('[data-o]')].find(e => e.dataset.o === name); el?.focus({ preventScroll: true });
}
document.onclick = e => {
  const t = e.target, o = t.closest('[data-o]'), fe = t.closest('[data-fe]'), fc = t.closest('[data-fc]'), fr = t.closest('[data-fr]'), fo = t.closest('[data-fo]');
  if (o) return toggle(o.dataset.o);
  if (fe) f.el = f.el === fe.dataset.fe ? '' : fe.dataset.fe;
  else if (fc) f.cls = f.cls === fc.dataset.fc ? '' : fc.dataset.fc;
  else if (fr) f.rar = f.rar === +fr.dataset.fr ? 0 : +fr.dataset.fr;
  else if (fo) f.own = !f.own;
  else return;
  draw();
};
document.onkeydown = e => { const o = e.target.closest?.('[data-o]'); if (o && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); toggle(o.dataset.o) } };
$('#s').oninput = draw;
draw();
</script></body></html>
