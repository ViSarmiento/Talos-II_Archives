<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="/js/loader.js"></script>
  <title>Operator – Talos-II Archives</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="operators"><main class="od">
  <a class="od-back" href="/operators">‹ All operators</a>
  <h2 data-decrypt id="nm">Operator</h2>
  <div id="od"></div>
</main>
<script src="/js/data.js"></script><script src="/js/core.js"></script><script src="/js/synergy.js"></script><script src="/js/opdata.js"></script><script src="/js/app.js"></script>
<script>
  // which operator: /operators/<slug> (rewritten to this page) or ?op=<name>
  const slugIn = decodeURIComponent((location.pathname.match(/^\/operators\/([^/]+)\/?$/) || [])[1] || new URLSearchParams(location.search).get('op') || '');
  const o = opBySlug(slugIn), root = $('#od');
  const sorted = ROSTER.slice().sort((x, y) => y.rarity - x.rarity || x.name.localeCompare(y.name));

  // description paragraphs: a leading "LABEL:" (BASIC ATTACK:, COMBO TRIGGER: ...) is shown as a small caps tag
  const para = t => { const m = /^([A-Z][A-Z' -]{2,}):\s*(.*)$/.exec(t); return m ? `<p><b class="lab">${esc(m[1])}</b> ${esc(m[2])}</p>` : `<p>${esc(t)}</p>` };
  const icImg = u => u ? `<img alt="" loading="lazy" src="${esc(u)}" onerror="this.remove()">` : '';
  // one collapsible combat skill: icon, type and name in the summary, the description folds open below
  const skillItem = s => `<details class="od-sk" data-t="${esc(s.label || SKILL_LABEL[s.type] || s.type)}"><summary><span class="ic">${icImg(s.icon)}</span><div><small>${esc(s.label || SKILL_LABEL[s.type] || s.type)}</small><b>${esc(s.name || '…')}</b></div><i class="chev" aria-hidden="true"></i></summary><div class="od-skd">${(s.desc || []).map(para).join('') || '<p class="dim">No description.</p>'}</div></details>`;
  // ---- terminal carousel: four pages, same frame, rows and text animation as the account terminal ----
  let tmN = 0;
  // data-dc marks short text that is decrypted (scrambled glyphs locking in left to right) on top of the row's tmIn slide-in
  const dc = t => `<span data-dc>${esc(t)}</span>`;
  const kvh = (k, html) => html ? `<div class="tm-kv" style="--i:${++tmN}"><span class="k">${esc(k)}</span><span class="v">${html}</span></div>` : '';
  const kv = (k, v) => v ? kvh(k, dc(v)) : '';
  const tmSec = t => `<div class="tm-sec" style="--i:${++tmN}"><span data-dc>${esc(t)}</span></div>`;
  const tmTx = t => t ? `<p class="tm-tx" style="--i:${++tmN}">${esc(t)}</p>` : '';
  const tmEntry = (lab, e) => `<div class="tm-xp" style="--i:${++tmN}"><div class="h"><span class="k">${esc(lab)} ${e.n || ''}</span> ${dc(e.category)}${e.name ? ` <span class="sl">//</span> ${dc(e.name)}` : ''}</div>${e.desc ? `<p class="tm-tx">${esc(e.desc)}</p>` : ''}</div>`;
  const noFile = (o, what) => `<p class="tm-none" style="--i:${++tmN}">NO SYNCED ${what} FOR ${esc(o.name.toUpperCase())}. Run <code>npm run sync</code> to pull it from the wiki.</p>`;

  // returns [{ id, title, html() }]; html() restarts the row counter so every page staggers in from the top
  function tmPages(o, d, x) {
    const P = d && d.profile, ex = (P && P.exam) || {};
    const wp = P && P.weapons && P.weapons.length ? P.weapons : (x.weapons || []).map(n => ({ name: n, icon: '', match: '' }));
    const withIcon = (ic, t) => `${ic ? `<img class="od-ai" alt="" src="${esc(ic)}" onerror="this.remove()">` : ''}${dc(t)}`;
    const attr = (n, ic) => n ? withIcon(ic, n) : '';
    const tags = (d && d.tags && d.tags.length ? d.tags : x.tags) || [];
    const wRow = w => `<a class="tm-wp" style="--i:${++tmN}" target="_blank" rel="noopener" href="${esc(WIKI_PAGE + '/' + encodeURIComponent(w.name.replace(/ /g, '_')))}">${icImg(w.icon)}<span>${esc(w.name)}</span></a>`;
    const groups = ['Skills', 'Stats', ''].map(g => [g, wp.filter(w => (w.match || '') === g)]).filter(([, l]) => l.length);
    return [
      { id: 'badges', title: 'TOP BADGES', html: () => (tmN = 0, tmSec('TOP BADGES')
        + kvh('Rarity', `<span class="tm-stars" aria-label="${o.rarity}-star">${stars(o.rarity)}</span>`)
        + kvh('Class', icoCls(o.cls) + dc(o.cls))
        + kvh('Weapon', dc(o.weapon))
        + kvh('Element', icoEl(o.element) + dc(o.element))
        + kvh('Faction', d && d.faction ? withIcon(d.factionIcon, d.faction) : (x.faction ? dc(x.faction) : ''))
        + kvh('Role tags', tags.length ? `<span class="tm-chips">${tags.map(t => `<span>${dc(t)}</span>`).join('')}</span>` : '')
        + kvh('Main attribute', attr(d && d.mainAttr, d && d.mainAttrIcon))
        + kvh('Sub attribute', attr(d && d.subAttr, d && d.subAttrIcon))) },
      { id: 'basic', title: 'BASIC INFO', html: () => (tmN = 0, !P ? tmSec('BASIC INFO') + noFile(o, 'PROFILE')
        : tmSec('BASIC INFO') + kv('Codename', o.name) + kv('Gender', P.gender) + kv('Authentication', P.authentication) + kv('Date of birth', P.dob) + kv('Race', P.race)
        + (P.oripathy ? tmSec('ORIPATHY INFECTION STATUS') + tmTx(P.oripathy) : '')
        + (Object.values(ex).some(Boolean) ? tmSec('INTEGRATED PHYSICAL EXAM') + kv('Physiological strength', ex.physiologicalStrength) + kv('Combat skill', ex.combatSkill) + kv('Tactical acumen', ex.tacticalAcumen) + kv('Originium arts assimilation', ex.originiumArtsAssimilation) : '')) },
      { id: 'expertise', title: 'EXPERTISE & HOBBIES', html: () => (tmN = 0, !P ? tmSec('EXPERTISE') + noFile(o, 'PROFILE')
        : ((P.expertise || []).length ? tmSec('EXPERTISE') + P.expertise.map(e => tmEntry('EXP', e)).join('') : '')
        + ((P.hobbies || []).length ? tmSec('HOBBIES') + P.hobbies.map(e => tmEntry('HOB', e)).join('') : '')
        || tmSec('EXPERTISE') + '<p class="tm-none">No expertise or hobbies listed.</p>') },
      { id: 'weapons', title: 'RECOMMENDED WEAPONS', html: () => (tmN = 0, !wp.length ? tmSec('RECOMMENDED WEAPONS') + noFile(o, 'WEAPONS')
        : tmSec('RECOMMENDED WEAPONS') + groups.map(([g, l]) => `<div class="tm-wg">${g ? `<small style="--i:${++tmN}">MATCHING ${g.toUpperCase()}</small>` : ''}<div class="tm-wl">${l.map(wRow).join('')}</div></div>`).join('')) },
    ];
  }

  // frame + carousel wiring. The body is rebuilt on every page change, which restarts the CSS tmIn stagger; decrypt() then types the short values.
  function terminal(o, d, x) {
    const pages = tmPages(o, d, x), last = pages.length - 1;
    const host = document.createElement('section');
    host.className = 'tm od-tm'; host.tabIndex = 0; host.setAttribute('role', 'region'); host.setAttribute('aria-label', 'Operator file');
    host.innerHTML = `<i class="tm-c a"></i><i class="tm-c b"></i><i class="tm-c c"></i><i class="tm-c d"></i>
      <header class="tm-h"><span class="tm-ttl"><i class="tm-dot"></i>TALOS-II TERMINAL<em> // ${esc(o.name.toUpperCase())}</em></span><span class="tm-pn" id="tmpn"></span></header>
      <div class="tm-b tm-pg" id="tmpg" aria-live="polite"></div>
      <footer class="tm-f tm-nav"><button type="button" class="tm-nb" id="tmprev" aria-label="Previous page">‹ <span>PREV</span></button><span class="tm-dots" id="tmdots" aria-hidden="true">${pages.map(() => '<i></i>').join('')}</span><button type="button" class="tm-nb" id="tmnext" aria-label="Next page"><span>NEXT</span> ›</button></footer>`;
    const pg = host.querySelector('#tmpg'), prev = host.querySelector('#tmprev'), next = host.querySelector('#tmnext'), dots = [...host.querySelectorAll('#tmdots i')];
    let at = 0;
    const show = n => {
      at = Math.max(0, Math.min(last, n));
      const p = pages[at];
      host.querySelector('#tmpn').textContent = `${String(at + 1).padStart(2, '0')}/${String(pages.length).padStart(2, '0')} // ${p.title}`;
      pg.innerHTML = p.html(); pg.scrollTop = 0;
      // first page hides Prev, last page hides Next; they come back as soon as there is somewhere to go
      prev.style.visibility = at === 0 ? 'hidden' : 'visible'; prev.tabIndex = at === 0 ? -1 : 0; prev.setAttribute('aria-hidden', at === 0);
      next.style.visibility = at === last ? 'hidden' : 'visible'; next.tabIndex = at === last ? -1 : 0; next.setAttribute('aria-hidden', at === last);
      dots.forEach((el, i) => el.classList.toggle('on', i === at));
      // same typing effect as the account terminal: each short value scrambles, then locks in left to right as its row slides in
      pg.querySelectorAll('[data-dc]').forEach(el => {
        const row = el.closest('[style*="--i"]'), i = row ? parseFloat(row.style.getPropertyValue('--i')) || 0 : 0;
        el.style.visibility = 'hidden';
        decrypt(el, { delay: i * 40, duration: Math.min(700, 260 + el.textContent.length * 22) });
      });
    };
    prev.onclick = () => show(at - 1);
    next.onclick = () => show(at + 1);
    host.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' && at > 0) { e.preventDefault(); show(at - 1) } else if (e.key === 'ArrowRight' && at < last) { e.preventDefault(); show(at + 1) } });
    let sx = null;   // swipe on touch screens
    pg.addEventListener('pointerdown', e => { sx = e.pointerType === 'touch' ? e.clientX : null });
    pg.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 60) show(at + (dx < 0 ? 1 : -1)) });
    host._show = show;
    return host;
  }

  if (!o) {
    document.title = 'Operator not found – Talos-II Archives';
    $('#nm').textContent = 'Operator not found';
    root.innerHTML = `<p class="dim">There is no operator called “${esc(slugIn)}”. Pick one from the <a href="/operators">Operators</a> list.</p>`;
    FL.wait(Promise.resolve());
  } else {
    // operator data is one static file written by `npm run sync`; the loader screen waits for it and for the art
    FL.wait(loadOperatorDb().then(db => { render(db); return artReady() }));
  }

  function render(db) {
    document.title = `${o.name} – Operators – Talos-II Archives`;
    $('#nm').textContent = o.name;
    const x = OP_DETAIL[o.name] || {};
    const idx = sorted.findIndex(r => r.name === o.name), prev = sorted[(idx + sorted.length - 1) % sorted.length], next = sorted[(idx + 1) % sorted.length];
    const d = opRecord(db, o);
    // synced record first; the hand-written OP_DETAIL entry (Laevatain, Si) fills in whatever the record lacks
    const skills = d && d.skills.length ? d.skills : (x.skills || []).map(([t, n, desc]) => ({ label: t, name: n, desc: [desc], icon: '' }));
    const synced = db && db.generatedAt ? fmtDate(Date.parse(db.generatedAt)) : '';

    root.innerHTML = `<section class="od-hero" style="--c:${COL[o.element]}" data-rar="${o.rarity}">
        <div class="od-art">${artHtml(o, 900, { whole: true })}<span class="od-bar"></span></div>
        <div class="od-term" id="tmhost"></div>
      </section>

      <section class="od-sec"><div class="od-hd"><h3>Combat skills</h3>${skills.length ? '<button type="button" class="ghost od-xa" id="xa" data-open="0">Expand all</button>' : ''}</div>
        ${skills.length ? `<div class="od-skl" id="sk">${skills.map(skillItem).join('')}</div>` : `<p class="dim">No skill data for ${esc(o.name)} yet. Run <code>npm run sync</code>, or read them <a href="${esc(wikiUrl(o, '#Combat_Skills'))}" target="_blank" rel="noopener">on the wiki ↗</a>.</p>`}
      </section>

      <nav class="od-nav"><a href="/operators/${opSlug(prev.name)}">‹ ${esc(prev.name)}</a><a href="/operators">All operators</a><a href="/operators/${opSlug(next.name)}">${esc(next.name)} ›</a></nav>
      <p class="dim od-fine">Operator data from the Endfield Talos Wiki (CC BY-SA)${synced ? `, synced ${esc(synced)}` : ''}. Always check the wiki for exact skill numbers.</p>`;

    const tm = terminal(o, d, x);
    $('#tmhost').appendChild(tm);
    // the first page types in once the loading screen has cleared, like the title decrypt
    let shown = false;
    const go = () => { if (!shown) { shown = true; tm._show(0) } };
    if (window.__flDone || !window.FL) go(); else { addEventListener('fl:done', () => setTimeout(go, 260), { once: true }); setTimeout(go, 9000) }

    const xa = $('#xa');
    if (xa) xa.onclick = () => { const open = xa.dataset.open !== '1'; $('#sk').querySelectorAll('details').forEach(el => { el.open = open }); xa.dataset.open = open ? '1' : '0'; xa.textContent = open ? 'Collapse all' : 'Expand all' };
  }
</script></body></html>
